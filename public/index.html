<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eB2B Mock Seller</title>
  <meta name="description" content="Mock ONDC eB2B (DigiDukaan) Seller NP for buyer-app developers: your app calls it, it answers per the scenario you activate.">
  <link rel="icon" href="/img/seller.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>eB2B Mock Seller NP</h1>
        <p>ONDC:RETeB2B · core 1.2.5 · your buyer app calls the mock; the mock answers per the scenario you activate</p>
      </div>
      <div class="endpoint">
        <span class="label">bpp_uri</span>
        <code id="bppUri"></code>
        <button class="ghost" data-copy="#bppUri" type="button">Copy</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="card target">
      <label>Your buyer app - its bap_id or bap_uri <input id="bapId" placeholder="e.g. ondc.test.bms.qwipo.com or https://ondc.test.bms.qwipo.com/api/v1/retail_eb2b_buyer" spellcheck="false"></label>
      <p class="hint" id="targetHint"></p>
      <div class="callers" id="callers"></div>
    </section>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="scenarios" aria-selected="true">Scenarios</button>
      <button role="tab" data-tab="activity">Activity <span class="count" id="activityCount"></span></button>
      <button role="tab" data-tab="catalogue">Catalogue</button>
      <button role="tab" data-tab="retailers">Retailers</button>
    </nav>

    <section id="tab-scenarios" class="tab">
      <div class="split">
        <aside id="scenarioList" class="scenario-list"></aside>
        <div id="scenarioRun"></div>
      </div>
    </section>

    <section id="tab-activity" class="tab" hidden>
      <div id="orders"></div>
      <div class="activity-head">
        <h2>Calls from your buyer app</h2>
        <span class="muted" id="activityState"></span>
      </div>
      <div id="activity" class="out"></div>
    </section>

    <section id="tab-catalogue" class="tab" hidden>
      <div id="catalogue"></div>
    </section>

    <section id="tab-retailers" class="tab" hidden>
      <div id="retailers"></div>
    </section>
  </main>

  <template id="tplCall">
    <details class="call" open>
      <summary><span class="pill"></span><span class="name"></span><span class="meta muted"></span></summary>
      <div class="call-body"></div>
    </details>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
