<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eB2B Mock Seller</title>
  <meta name="description" content="Mock ONDC eB2B (DigiDukaan) Seller NP: your buyer app sends the calls, the mock answers, every call is tracked live per flow.">
  <link rel="icon" href="/img/seller.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>eB2B Mock Seller NP</h1>
        <p>ONDC:RETeB2B · core 1.2.5 · Seller (BPP) mock for buyer-app testing</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="card info">
      <div class="info-head">
        <h2>Info</h2>
        <span class="muted" id="liveState"></span>
      </div>
      <div class="chips" id="infoChips"></div>
    </section>

    <section class="card endpoints">
      <h2>Endpoints</h2>
      <div class="endpoint-grid">
        <div>
          <span class="label">Send your calls to</span>
          <div class="endpoint-box"><code id="sendTo"></code><button class="ghost" data-copy="#sendTo" type="button">Copy</button></div>
        </div>
        <div>
          <label class="label" for="bapId">You will receive calls at (your bap_uri, or bap_id)</label>
          <input id="bapId" placeholder="https://ondc.test.bms.qwipo.com/api/v1/retail_eb2b_buyer" spellcheck="false">
          <div class="callers" id="callers"></div>
        </div>
      </div>
      <p class="hint" id="targetHint"></p>
    </section>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="flows" aria-selected="true">Flows</button>
      <button role="tab" data-tab="orders">Orders <span class="count" id="orderCount"></span></button>
      <button role="tab" data-tab="activity">All calls <span class="count" id="activityCount"></span></button>
      <button role="tab" data-tab="catalogue">Catalogue</button>
      <button role="tab" data-tab="retailers">Retailers</button>
    </nav>

    <section id="tab-flows" class="tab">
      <div class="flows-layout">
        <div id="flowList" class="flow-list"></div>
        <aside class="inspector card">
          <div class="inspector-title" id="inspTitle">Select a call</div>
          <div class="insp-tabs" role="tablist">
            <button role="tab" data-insp="request" aria-selected="true">Request</button>
            <button role="tab" data-insp="response">Response</button>
            <button role="tab" data-insp="guide">Guide</button>
          </div>
          <input id="inspSearch" class="insp-search" placeholder="Search" spellcheck="false">
          <pre id="inspBody" class="insp-body">{}</pre>
        </aside>
      </div>
    </section>

    <section id="tab-orders" class="tab" hidden>
      <div class="orders-layout">
        <div class="order-list" id="orderList"></div>
        <article class="card order-detail" id="orderDetail"></article>
      </div>
    </section>

    <section id="tab-activity" class="tab" hidden>
      <div class="activity-head">
        <h2>Every call from your buyer app</h2>
        <span class="muted" id="activityState"></span>
      </div>
      <div id="activity" class="out"></div>
    </section>

    <section id="tab-catalogue" class="tab" hidden>
      <div id="catalogue"></div>
    </section>

    <section id="tab-retailers" class="tab" hidden>
      <div id="retailers"></div>
    </section>
  </main>

  <template id="tplCall">
    <details class="call" open>
      <summary><span class="pill"></span><span class="name"></span><span class="meta muted"></span></summary>
      <div class="call-body"></div>
    </details>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
